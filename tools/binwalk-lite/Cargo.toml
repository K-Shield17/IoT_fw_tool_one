[package]
name = "binwalk"
version = "3.1.0-iotfw"
edition = "2021"
authors = ["Craig Heffner <heffnercj@gmail.com>"]
license = "MIT"
description = "IoT-focused subset of Binwalk 3.1.0"

[dependencies]
log = "0.4.22"
chrono = "0.4.38"
walkdir = "2.5.0"
crc32-v2 = "0.0.4"
xz2 = "0.1.7"
bzip2 = "0.4.4"
serde_json = "1.0"
env_logger = "0.11.5"
flate2 = "1.0.34"
aho-corasick = "1.1.3"
serde = { version = "1.0", features = ["derive"] }

[dependencies.uuid]
version = "1.10.0"
features = ["v4", "fast-rng", "macro-diagnostics"]
